name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Normal deploy: build the site. Skipped while SITE_OFFLINE is "true".
      - name: Build and upload site
        if: vars.SITE_OFFLINE != 'true'
        uses: withastro/action@v3
        with:
          node-version: 20

      # Offline mode: publish the holding page instead of the site.
      - name: Upload holding page
        if: vars.SITE_OFFLINE == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: holding

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
